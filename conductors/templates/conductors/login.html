{% extends 'base.html' %}

{% block content %}
<div class="card fade-in" style="max-width: 400px; margin: 50px auto;">
    <h2 data-i18n="login_title" style="text-align: center; margin-bottom: 20px;">Conductor Login</h2>
    {% if error %}
        <div style="color:var(--danger); margin-bottom:15px; text-align:center;">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{% url 'conductor_login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label data-i18n="username">Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label data-i18n="password">Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label data-i18n="select_bus">Select Bus</label>
            <select name="bus_id" required>
                {% for b in buses %}
                <option value="{{ b.id }}">{{ b.bus_number }} - {{ b.route.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="login_btn">Sign In</button>
    </form>
</div>
{% endblock %}
