<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNSTC QR Ticket</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/i18n.js"></script>
    {% block extra_head %}{% endblock %}
    <link rel="manifest" href="/static/conductors/manifest.json">
</head>
<body>
    <header class="app-header" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
        <div class="logo-area" style="display: flex; align-items: center; gap: 10px;">
            <img src="/static/images/logo.png" alt="BusKaro Logo" style="height: 40px; border-radius: 8px;">
            <span style="font-weight: bold; font-size: 1.2rem; display: none;">BusKaro</span>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            {% if user.is_authenticated %}
                <span style="color: white; font-size: 0.9rem;">{{ user.username }}</span>
                <a href="{% url 'passenger_logout' %}" style="color: white; font-size: 0.9rem; text-decoration: none;">Logout</a>
            {% else %}
                <a href="{% url 'passenger_login' %}" style="color: white; font-size: 0.9rem; text-decoration: none;">Login</a>
            {% endif %}
            <button id="lang-toggle" onclick="toggleLanguage()">EN / தமிழ்</button>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/main.js"></script>
    {% block extra_scripts %}{% endblock %}
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/conductors/sw.js', { scope: '/conductor/' })
                    .then(reg => console.log('SW registered!', reg))
                    .catch(err => console.error('SW failed:', err));
            });
        }
    </script>
</body>
</html>
