<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Ticket System - Welcome</title>
    <style>
        :root {
            --primary: #ebe125ff;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }
        .container h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .container p {
            color: var(--text-sub);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
        }
        .card h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }
        .card p {
            font-size: 0.95rem;
            margin: 0;
            color: var(--text-sub);
        }
        .badge {
            display: inline-block;
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 15px;
        }
        .badge-green {
            background-color: #dcfce7;
            color: #15803d;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bus Management Portal</h1>
        <p>Select your portal access below to continue.</p>

        <div class="grid">
            <a href="/passenger/" class="card">
                <h2>👤 Passenger</h2>
                <p>Search, book, and view bus tickets.</p>
                <span class="badge-green">No Login Required</span>
            </a>

            <a href="/conductor/login/" class="card">
                <h2>🚌 Conductor</h2>
                <p>Manage trips and scan passenger tickets.</p>
                <span class="badge">Password Required</span>
            </a>

            <a href="/sysadmin/" class="card">
                <h2>⚙️ SysAdmin</h2>
                <p>Manage fleet, operators, and view analytics.</p>
                <span class="badge">Password Required</span>
            </a>
        </div>
    </div>

</body>
</html>
